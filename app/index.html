<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A fast, read-only make.fun frontend: live bounty board, bounty pages, leaderboards and public profiles, straight from make.fun's public API.">
<title>make.fun bounties</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">make.fun</a>
  <nav aria-label="Main">
    <a href="#/">Board</a>
    <a href="#/bounty/makefun-frontend-01">This bounty</a>
  </nav>
  <form id="lookup" role="search" aria-label="Look up a profile">
    <label class="sr" for="handle">Profile handle</label>
    <input id="handle" name="handle" type="search" placeholder="@handle" autocomplete="off" spellcheck="false">
    <button type="submit">Profile</button>
  </form>
</header>
<main id="app" aria-live="polite"></main>
<footer><p>Read-only client for <a href="https://make.fun">make.fun</a> · live data from its public API · no sign-in, no tracking.</p></footer>
</body>
</html>
